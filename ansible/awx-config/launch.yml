---
# Launches an AWX job template and waits for it to finish. Used by the ops-trigger workflow.
# Variables: template (required), limit (optional), launch_extra_vars (optional JSON string).
- name: Launch an AWX job template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    limit: ""
    launch_extra_vars: "{}"
  tasks:
    - name: Require a template name
      ansible.builtin.assert:
        that:
          - template is defined
          - template | string | length > 0
          # A purely numeric value would be treated by AWX as a template ID, not a name.
          - template | string is not match('^[0-9]+$')
        fail_msg: Pass the full job template name, for example "10 Health check"
        quiet: true

    - name: Launch and wait
      awx.awx.job_launch:
        job_template: "{{ template }}"
        limit: "{{ limit | default(omit, true) }}"
        extra_vars: "{{ launch_extra_vars | from_json }}"
        wait: true
        timeout: 3600
      register: job

    - name: Result
      ansible.builtin.debug:
        msg: "Job {{ job.id }} ({{ template }}) finished with status {{ job.status }}"
