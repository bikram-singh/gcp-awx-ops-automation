---
# Desired state of AWX. Edit this file, push to main, and the awx-config workflow applies it.
# Everything here is idempotent: the names match what you created by hand, so the first run adopts them.

awx_organization: Default

awx_credential:
  name: fleet-ssh
  username: ansible
  # The private key is never stored in Git. It comes from the FLEET_SSH_PRIVATE_KEY repository secret.
  # If the secret is not set, the credential is left as it is (it must already exist).

awx_project:
  name: awx-ops-playbooks
  scm_url: https://github.com/bikram-singh/gcp-awx-ops-automation.git
  scm_branch: main
  update_on_launch: true

awx_inventory:
  name: gcp-fleet
  description: GCE VMs labelled ansible_managed=true, grouped by env, role and patch group
  source:
    name: gce-dynamic
    source_path: ansible/inventories/gcp_compute.yml

awx_templates:
  - name: "00 Connectivity check"
    description: Proves AWX can log in to every managed VM
    playbook: ansible/playbooks/connectivity_check.yml
    ask_limit: true
    ask_variables: true

  - name: "10 Health check"
    description: Read-only disk, memory, load and failed-service report
    playbook: ansible/playbooks/health_check.yml
    verbosity: 1
    ask_limit: true
    ask_variables: true

  - name: "20 Patch Linux (rolling)"
    description: Rolling OS patching with reboot handling and a post-patch service check
    playbook: ansible/playbooks/patch_linux.yml
    ask_limit: true
    ask_variables: true

  - name: "21 Patch Linux DEV (dry run)"
    description: Check mode against env_dev, one host at a time. Safe to run any time
    playbook: ansible/playbooks/patch_linux.yml
    job_type: check
    limit: env_dev
    extra_vars:
      patch_batch_size: 1
      patch_max_fail_percent: 0
    ask_limit: true
    ask_variables: true

  - name: "30 Snapshot disks (pre-patch)"
    description: Boot-disk snapshot of each target VM, the rollback point before patching
    playbook: ansible/playbooks/snapshot_disks.yml
    ask_limit: true
    ask_variables: true

  - name: "40 Heal: start stopped VM"
    description: Self-healing. Starts a managed VM that was stopped. Launched by the Pub/Sub bridge, or by hand with heal_instance and heal_zone
    playbook: ansible/playbooks/heal_stopped_vm.yml
    verbosity: 1
    ask_variables: true

# Workflows: chains of templates with success/approval gates. Each node has an id and lists the ids that run on success.
# A node either runs a template or is an approval gate. Node limits override the template's prompt-on-launch limit.
awx_workflows:
  - name: "50 Staged patching (dev, approve, prod)"
    description: Pre-check, snapshot, patch and verify dev, wait for a human approval, then do the same for prod
    nodes:
      - id: precheck
        template: "10 Health check"
        limit: all
        success: [snap_dev]

      - id: snap_dev
        template: "30 Snapshot disks (pre-patch)"
        limit: env_dev
        success: [patch_dev]

      - id: patch_dev
        template: "20 Patch Linux (rolling)"
        limit: env_dev
        extra_data: {patch_batch_size: 1, patch_max_fail_percent: 0}
        success: [verify_dev]

      - id: verify_dev
        template: "10 Health check"
        limit: env_dev
        extra_data: {fail_on_issues: true}
        success: [approve_prod]

      - id: approve_prod
        approval:
          name: Promote patching to prod?
          description: Dev was patched and verified. Approve to snapshot and patch env_prod, deny to stop here
          timeout: 86400
        success: [snap_prod]

      - id: snap_prod
        template: "30 Snapshot disks (pre-patch)"
        limit: env_prod
        success: [patch_prod]

      - id: patch_prod
        template: "20 Patch Linux (rolling)"
        limit: env_prod
        extra_data: {patch_batch_size: 1, patch_max_fail_percent: 0}
        success: [verify_prod]

      - id: verify_prod
        template: "10 Health check"
        limit: env_prod
        extra_data: {fail_on_issues: true}

awx_schedules:
  - name: Daily health check 02:00 UTC
    template: "10 Health check"
    rrule: "DTSTART:20261022T020000Z RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true

# The Pub/Sub bridge logs in as this AWX user. It may run the listed templates and nothing else.
# Its password is created by the selfheal Terraform stack (Kubernetes secret selfheal-bridge);
# the awx-config workflow reads it and applies it here.
awx_selfheal:
  username: selfheal
  templates:
    - "40 Heal: start stopped VM"

# Access control. Three teams with separate duties: look, operate, approve prod.
# Nobody needs the admin account for daily work. The people in the teams below are demo users that are
# only created when the DEMO_USER_PASSWORD repository secret is set (see docs/PHASE7.md).
awx_rbac:
  teams:
    - name: ops-readonly
      description: Can see everything in the organization, can change nothing
    - name: ops-operators
      description: Runs day-to-day operations (connectivity, health, dry-run patching, snapshots)
    - name: prod-approvers
      description: Decides whether patching is promoted to production
  grants:
    - team: ops-readonly
      role: auditor
      organization: Default
    - team: ops-operators
      role: execute
      job_templates:
        - "00 Connectivity check"
        - "10 Health check"
        - "21 Patch Linux DEV (dry run)"
        - "30 Snapshot disks (pre-patch)"
    - team: prod-approvers
      role: approval
      workflows:
        - "50 Staged patching (dev, approve, prod)"
  demo_users:
    - username: viewer
      team: ops-readonly
    - username: operator
      team: ops-operators
    - username: approver
      team: prod-approvers
