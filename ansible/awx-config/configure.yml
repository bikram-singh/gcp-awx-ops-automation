---
# Applies awx_config.yml to a running AWX through its API (awx.awx collection).
# Connection settings come from the environment: CONTROLLER_HOST, CONTROLLER_USERNAME,
# CONTROLLER_PASSWORD, CONTROLLER_VERIFY_SSL. The awx-config workflow sets them.
- name: Configure AWX from code
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - awx_config.yml
  tasks:
    - name: Make sure the AWX connection settings are present
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'CONTROLLER_HOST') | length > 0
          - lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | length > 0
        fail_msg: Set CONTROLLER_HOST, CONTROLLER_USERNAME and CONTROLLER_PASSWORD first
        quiet: true

    - name: SSH credential for the fleet (only when the key is supplied)
      awx.awx.credential:
        name: "{{ awx_credential.name }}"
        organization: "{{ awx_organization }}"
        credential_type: Machine
        description: Key for the ansible user on the managed VMs
        inputs:
          username: "{{ awx_credential.username }}"
          ssh_key_data: "{{ lookup('ansible.builtin.env', 'FLEET_SSH_PRIVATE_KEY') }}"
        update_secrets: false
        state: present
      when: lookup('ansible.builtin.env', 'FLEET_SSH_PRIVATE_KEY') | length > 0
      no_log: true

    - name: Project that holds the playbooks
      awx.awx.project:
        name: "{{ awx_project.name }}"
        organization: "{{ awx_organization }}"
        scm_type: git
        scm_url: "{{ awx_project.scm_url }}"
        scm_branch: "{{ awx_project.scm_branch }}"
        scm_update_on_launch: "{{ awx_project.update_on_launch }}"
        wait: true
        state: present

    # AWX only accepts a template if the playbook is in the project's last sync, so pull the newest commit first.
    - name: Sync the project so new playbooks are visible
      awx.awx.project_update:
        name: "{{ awx_project.name }}"
        organization: "{{ awx_organization }}"
        wait: true
        timeout: 600

    - name: Inventory
      awx.awx.inventory:
        name: "{{ awx_inventory.name }}"
        organization: "{{ awx_organization }}"
        description: "{{ awx_inventory.description }}"
        state: present

    - name: Dynamic inventory source (from the project, keyless through Workload Identity)
      awx.awx.inventory_source:
        name: "{{ awx_inventory.source.name }}"
        inventory: "{{ awx_inventory.name }}"
        organization: "{{ awx_organization }}"
        source: scm
        source_project: "{{ awx_project.name }}"
        source_path: "{{ awx_inventory.source.source_path }}"
        overwrite: true
        overwrite_vars: true
        update_on_launch: true
        state: present

    - name: Job templates
      awx.awx.job_template:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ awx_organization }}"
        job_type: "{{ item.job_type | default('run') }}"
        inventory: "{{ awx_inventory.name }}"
        project: "{{ awx_project.name }}"
        playbook: "{{ item.playbook }}"
        credentials:
          - "{{ awx_credential.name }}"
        limit: "{{ item.limit | default(omit) }}"
        extra_vars: "{{ item.extra_vars | default(omit) }}"
        verbosity: "{{ item.verbosity | default(0) }}"
        ask_limit_on_launch: "{{ item.ask_limit | default(false) }}"
        ask_variables_on_launch: "{{ item.ask_variables | default(false) }}"
        ask_inventory_on_launch: false
        state: present
      loop: "{{ awx_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Schedules
      awx.awx.schedule:
        name: "{{ item.name }}"
        unified_job_template: "{{ item.template }}"
        rrule: "{{ item.rrule }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: present
      loop: "{{ awx_schedules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Workflow job templates
      awx.awx.workflow_job_template:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ awx_organization }}"
        allow_simultaneous: false
        state: present
      loop: "{{ awx_workflows | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    # Pass 1: create every node (job template node or approval node).
    - name: Workflow nodes
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.1.id }}"
        workflow_job_template: "{{ item.0.name }}"
        organization: "{{ awx_organization }}"
        unified_job_template: "{{ item.1.template | default(omit) }}"
        lookup_organization: "{{ awx_organization if item.1.template is defined else omit }}"
        approval_node: "{{ item.1.approval | default(omit) }}"
        limit: "{{ item.1.limit | default(omit) }}"
        extra_data: "{{ item.1.extra_data | default(omit) }}"
        state: present
      loop: "{{ awx_workflows | default([]) | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.id }}"

    # Pass 2: link the nodes, now that all of them exist.
    - name: Workflow links (run on success)
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.1.id }}"
        workflow_job_template: "{{ item.0.name }}"
        organization: "{{ awx_organization }}"
        success_nodes: "{{ item.1.success }}"
        state: present
      loop: "{{ awx_workflows | default([]) | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.id }} -> {{ item.1.success | default([]) | join(', ') }}"
      when: item.1.success is defined

    - name: Self-heal bridge user (only when its password is supplied)
      awx.awx.user:
        username: "{{ awx_selfheal.username }}"
        first_name: Self-heal
        last_name: Bridge
        password: "{{ lookup('ansible.builtin.env', 'SELFHEAL_PASSWORD') }}"
        state: present
      when:
        - awx_selfheal is defined
        - lookup('ansible.builtin.env', 'SELFHEAL_PASSWORD') | length > 0
      no_log: true

    - name: Let that user run only its templates
      awx.awx.role:
        user: "{{ awx_selfheal.username }}"
        role: execute
        job_template: "{{ item }}"
        state: present
      loop: "{{ awx_selfheal.templates | default([]) }}"
      when:
        - awx_selfheal is defined
        - lookup('ansible.builtin.env', 'SELFHEAL_PASSWORD') | length > 0

    - name: Teams
      awx.awx.team:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ awx_organization }}"
        state: present
      loop: "{{ awx_rbac.teams | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Give each team its role
      awx.awx.role:
        teams:
          - "{{ item.team }}"
        role: "{{ item.role }}"
        organizations: "{{ [item.organization] if item.organization is defined else omit }}"
        job_templates: "{{ item.job_templates | default(omit) }}"
        workflows: "{{ item.workflows | default(omit) }}"
        state: present
      loop: "{{ awx_rbac.grants | default([]) }}"
      loop_control:
        label: "{{ item.team }}: {{ item.role }}"

    - name: Demo users (only when their shared password is supplied)
      awx.awx.user:
        username: "{{ item.username }}"
        password: "{{ lookup('ansible.builtin.env', 'DEMO_USER_PASSWORD') }}"
        update_secrets: false
        state: present
      loop: "{{ awx_rbac.demo_users | default([]) }}"
      loop_control:
        label: "{{ item.username }}"
      when: lookup('ansible.builtin.env', 'DEMO_USER_PASSWORD') | length > 0
      no_log: true

    - name: Put the demo users in their teams
      awx.awx.role:
        users:
          - "{{ item.username }}"
        target_teams:
          - "{{ item.team }}"
        role: member
        state: present
      loop: "{{ awx_rbac.demo_users | default([]) }}"
      loop_control:
        label: "{{ item.username }} in {{ item.team }}"
      when: lookup('ansible.builtin.env', 'DEMO_USER_PASSWORD') | length > 0
