---
# Dynamic inventory from the GCE API.
# In AWX this file is used by an Inventory Source of type "Sourced from a Project";
# No credential is attached: the job pod uses Workload Identity (application default credentials).
plugin: google.cloud.gcp_compute

projects:
  - gcp-awx-ops          # change if you use another project

auth_kind: application

filters:
  - status = RUNNING
  - labels.ansible_managed = true   # excludes other VMs, such as the GKE node

# One group per label value: env_dev, env_prod, role_web, role_app, role_db, patch_a, patch_b
keyed_groups:
  - key: labels.env
    prefix: env
  - key: labels.role
    prefix: role
  - key: labels.patch_group
    prefix: patch

hostnames:
  - name

# Fleet VMs have no public IP, so connect to the private address.
compose:
  ansible_host: networkInterfaces[0].networkIP
  ansible_user: "'ansible'"
  ansible_python_interpreter: "'/usr/bin/python3'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"

