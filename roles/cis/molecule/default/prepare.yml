---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install the SSH server, which the role validates its config against
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Make sure the drop-in directory is read by sshd
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"
