name: awx-connect
description: Authenticate to GCP keylessly, open a tunnel to the private AWX service and export the CONTROLLER_* settings.

inputs:
  wif_provider:
    description: Workload Identity provider resource name
    required: true
  service_account:
    description: Deployer service account email
    required: true
  cluster:
    description: GKE cluster name
    required: true
  location:
    description: GKE cluster region
    required: true

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.service_account }}

    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ inputs.cluster }}
        location: ${{ inputs.location }}

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Ansible and the awx.awx collection
      shell: bash
      run: |
        python -m pip install --quiet "ansible-core>=2.16,<2.18"
        ansible-galaxy collection install -r ansible/awx-config/requirements.yml

    - name: Tunnel to AWX and export connection settings
      shell: bash
      run: |
        nohup kubectl -n awx port-forward svc/awx-service 8080:80 >/tmp/port-forward.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8080/api/v2/ping/ >/dev/null 2>&1; then ready=1; break; fi
          sleep 2
        done
        [ "${ready:-0}" = 1 ] || { echo "AWX did not answer"; cat /tmp/port-forward.log; exit 1; }
        PASSWORD="$(kubectl -n awx get secret awx-admin-password -o jsonpath='{.data.password}' | base64 -d)"
        echo "::add-mask::${PASSWORD}"
        # The selfheal stack creates this secret. It is absent until that stack is applied, which is fine.
        BRIDGE_PASSWORD="$(kubectl -n awx get secret selfheal-bridge -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
        if [ -n "${BRIDGE_PASSWORD}" ]; then
          echo "::add-mask::${BRIDGE_PASSWORD}"
          echo "SELFHEAL_PASSWORD=${BRIDGE_PASSWORD}" >> "$GITHUB_ENV"
        fi
        {
          echo "CONTROLLER_HOST=http://localhost:8080"
          echo "CONTROLLER_USERNAME=admin"
          echo "CONTROLLER_PASSWORD=${PASSWORD}"
          echo "CONTROLLER_VERIFY_SSL=false"
        } >> "$GITHUB_ENV"
