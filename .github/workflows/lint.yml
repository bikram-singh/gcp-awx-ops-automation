name: lint

# Quality gate for everything Ansible: ansible-lint on playbooks, roles and AWX config,
# and Molecule tests (a real Debian 12 container with systemd) for each role.

on:
  pull_request:
    paths:
      - "ansible/**"
      - "roles/**"
      - "collections/**"
      - ".ansible-lint"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "roles/**"
      - "collections/**"
      - ".ansible-lint"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and collections
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.17,<2.18" ansible-lint
          ansible-galaxy collection install -r collections/requirements.yml -r ansible/awx-config/requirements.yml

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [cis]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.17,<2.18" molecule "molecule-plugins[docker]" docker

      - name: Molecule test
        working-directory: roles/${{ matrix.role }}
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
