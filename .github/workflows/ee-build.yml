name: ee-build

# Builds the custom AWX execution environment with ansible-builder and pushes it to Artifact Registry.
# Required repository VARIABLES: GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, GCP_PROJECT_ID
# Optional: GCP_REGION (default asia-south1)
# The deployer service account needs roles/artifactregistry.admin (added by scripts/bootstrap.sh;
# for an existing project run the gcloud command in docs/PHASE3.md).

on:
  push:
    branches: [main]
    paths:
      - "execution-env/**"
      - ".github/workflows/ee-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  IMAGE: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/awx-ee/gcp-ops

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Build
        run: >-
          ansible-builder build
          --file execution-env/execution-environment.yml
          --context execution-env/context
          --tag "${IMAGE}:${GITHUB_SHA::7}"
          --tag "${IMAGE}:latest"
          --container-runtime docker
          --verbosity 2

      - name: Push
        run: |
          docker push "${IMAGE}:${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
          {
            echo "### Execution environment pushed"
            echo
            echo "- \`${IMAGE}:${GITHUB_SHA::7}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
